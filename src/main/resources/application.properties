# these settings are global for every profile, other settings are profile specific
# they are found in application-<profile>.properties

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=30

#flyway properties
spring.flyway.locations=classpath:migrations
spring.flyway.validateMigrationNaming=true
#flyway clean drops every object in the schema. Nothing in this project calls it, and on the production
#datasource it would be unrecoverable, so it is disabled globally rather than per-profile - a setting that
#is only correct in prod is one that is missing in prod on the day it matters.
spring.flyway.clean-disabled=true

#logging Spring Boot uses LogBack
logging.level.root = INFO
#logging.file.path is a DIRECTORY (Spring writes <path>/spring.log inside it), not a file name - the
#default value below reads like a file because of its historical name, and it produces a directory called
#game_pensieve_log.log holding spring.log. Overridden in production (PENSIEVE_LOG_PATH=/var/log/pensieve in
#compose.production.yaml) to a path backed by the backend_logs volume; without a mount the log lives in the
#container's writable layer and is destroyed on every redeploy, which is exactly when it is wanted.
logging.file.path=${PENSIEVE_LOG_PATH:game_pensieve_log.log}
#Spring Boot's default rolling policy already rotates daily and at 10MB with 7 days of history, but leaves
#the TOTAL uncapped. The Droplet has one small disk shared with both databases and Caddy's certificate
#store, and a full disk takes all of them down together.
logging.logback.rollingpolicy.total-size-cap=200MB

#the default active profile, can be overwritten
spring.profiles.active=local

#virtual threads (Project Loom) - improves throughput for I/O-bound request handling
spring.threads.virtual.enabled=true

#entitlement - length of the auto-granted trial (days) stamped on JIT provisioning at first login; env-overridable.
#OAuth2 resource-server settings for the secured profile live in application-secured.properties.
entitlement.trial-days=${ENTITLEMENT_TRIAL_DAYS:30}

#Request body cap, enforced by RequestSizeLimitFilter - see that class for why Spring Boot has no built-in
#setting that covers a JSON @RequestBody. 10MB; the largest real collection backup here is ~3.3MB. Caddy
#enforces the same cap at the edge, so raise BOTH or neither.
pensieve.max-request-body-bytes=10485760
#How much of an aborted upload Tomcat will read and discard before closing the connection. Without a cap
#Tomcat swallows the whole body just to return the error cleanly, which hands back the bandwidth the 413
#above was meant to save. 2MB is enough to keep the connection reusable for ordinary requests.
server.tomcat.max-swallow-size=2MB

