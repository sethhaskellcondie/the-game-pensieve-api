# The docker profile's datasource. Every value is env-overridable and compose.production.yaml overrides all
# three (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), which is why there is no committed default password
# here any more: a literal `root` in a public repo is a credential that works the moment someone runs this
# profile without setting the variable. Leaving it unset instead means such a run fails to connect loudly,
# rather than succeeding against a database whose password is on GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/pensieve-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
