# Development topology, UNSECURED: the backend runs the permit-all build (`docker` profile alone), so no
# request needs a token and the API behaves like the original single-user deployment. Keycloak still runs so
# the OAuth flow can be developed and the realm kept honest, but nothing requires it.
#
# There is deliberately no plain `compose.yaml` — the security posture is always named on the command line:
#   docker compose -f dockerCompose/compose.unsecured.yaml up -d   # this file: permit-all
#   docker compose -f dockerCompose/compose.secured.yaml   up -d   # includes this file, flips to docker,secured
# Both pin the same project `name:` below, so they share the same containers and volumes and you can switch
# modes without losing the database.
#
# PATHS ARE RELATIVE TO THIS FILE, NOT TO YOUR SHELL. Compose resolves the build context and every bind mount
# below against the project directory — the directory holding the first `-f` file, i.e. dockerCompose/ — so
# `..` is the repo root no matter where you invoke compose from. (These were once ${PWD} paths, which silently
# became empty directories when compose was run from anywhere but the repo root.)
#
# `scripts/seed-test-data.sh` needs the SECURED stack (it drives real accounts, roles, and RLS).
# Production is a different file again: compose.production.yaml.

# Pinned, not derived. Compose otherwise names the project after the directory holding this file — which
# would be `dockerCompose`, and would strand the existing dev volumes the moment these files moved.
name: the-game-pensieve-api

services:
  frontend:
    image: sethcondie/the-game-pensieve-web:latest
    ports:
      - "4200:3000" #host port:container port (Next.js server listens on 3000)
    environment:
      # Server-side only; must include the /v1 prefix. Reaches the backend service
      # over the docker-compose network.
      API_BASE_URL: http://backend:8080/v1
      # A committed DEV credential, like the db password below — fine here, never in production.
      # The image runs NODE_ENV=production, where the BFF refuses to boot without a >=32-char
      # SESSION_SECRET (it exits 1; production's compose additionally guards it with `:?required`).
      SESSION_SECRET: dev-stack-session-secret-committed-and-public-not-for-production
    depends_on:
      - backend
  backend:
    depends_on:
      - db
    build:
      # The repo root — the Dockerfile and target/*.jar both live there, one level up from this file.
      context: ..
      args:
        JAR_FILE: target/*.jar
    ports:
      - "8080:8080" #host port:container port
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # The dev database password, matching POSTGRES_PASSWORD on the db service below. It lives HERE and not
      # as a default in application-docker.properties: a committed default password is a credential that
      # works against any deployment whose operator forgot to override it. With no default, the `docker`
      # profile fails to connect loudly instead. Production sets this from its .env.
      SPRING_DATASOURCE_PASSWORD: root
  mcp:
    # The sidecar lives in its own repo (the-game-pensieve-mcp) and is consumed here as a published
    # image, the same way the front end is. To run local sidecar changes, build the image from that
    # repo first: docker build -t sethcondie/the-game-pensieve-mcp:latest.
    image: sethcondie/the-game-pensieve-mcp:latest
    ports:
      - "8090:3000" #host port:container port (MCP Streamable HTTP endpoint at /mcp)
    environment:
      # Reaches the backend service over the docker-compose network; must include the /v1 prefix.
      API_BASE_URL: http://backend:8080/v1
      PORT: "3000"
      # OAuth (Phase 4). MCP_AUTH_MODE defaults to "auto": enforce only when the backend reports
      # secureMode=true. The dev backend runs the unsecured `docker` profile, so enforcement stays
      # OFF here (tokenless, as in Phases 1-2) until Phase 5 secures the backend.
      # iss is the canonical host-facing issuer; JWKS is fetched over the internal docker-compose network.
      MCP_OAUTH_ISSUER: http://localhost:8081/realms/pensieve
      MCP_OAUTH_JWKS_URI: http://keycloak:8080/realms/pensieve/protocol/openid-connect/certs
      MCP_OAUTH_AUDIENCE: http://localhost:8090/mcp
    depends_on:
      - backend
      - keycloak
  flyway:
    depends_on:
      - db
    image: flyway/flyway
    # these commands use the provided volumes on the flyway container: https://hub.docker.com/r/flyway/flyway
    # -configFiles=/flyway/conf/flyway.config: will use the docker-flyway.config in this container
    # -locations=filesystem:/flyway/sql: tells the system we are using SQL migration files (not java)
    # -connectRetries=60 in case the db container isn't running before the flyway container, this will cause it to retry for about a minute
    # migrate (tells flyway what to do on load)
    command: -configFiles=/flyway/conf/flyway.config -locations=filesystem:/flyway/sql -connectRetries=60 migrate
    volumes:
      - ../src/main/resources/migrations:/flyway/sql       # these are host volumes (bind mounts), and the
      - ../docker-flyway.config:/flyway/conf/flyway.config # host paths resolve from THIS file's directory
  db:
    # Kept in step with compose.production.yaml (16.15-alpine). Patch bumps inside 16.x are
    # drop-in; a MAJOR move is not, and would need a dump and restore. See dockerComposeExplainer.md.
    image: postgres:16.15-alpine
    ports:
      - "5432:5432" #host port:container port
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: pensieve-db
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    # start-dev = dev mode (HTTP ok, no hostname strictness). --import-realm loads the pensieve realm
    # from the mounted import dir on the first boot. The import is fully declarative (pensieve:read scope +
    # audience mapper + built-in scopes + anonymous DCR are all in keycloak/import/pensieve-realm.json).
    command: start-dev --import-realm
    ports:
      - "8081:8080" #host 8081 -> container 8080 (backend already uses host 8080)
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the frontend hostname so token `iss` is CANONICAL and stable regardless of how Keycloak
      # is reached (browser via localhost:8081). BACKCHANNEL_DYNAMIC lets containers on the docker-compose
      # network still reach endpoints via http://keycloak:8080 (used for JWKS fetches by the sidecar
      # and API, which validate against the canonical issuer but fetch keys over the internal net).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ../keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    depends_on:
      - mailpit
  mailpit:
    # Dev mail catcher: the realm's smtpServer points at mailpit:1025, so Keycloak's verification and
    # password-reset emails are captured here instead of being delivered. Read them at http://localhost:8025.
    # Prod uses a real SMTP relay (compose.production.yaml); nothing but the realm's smtpServer differs.
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" #host port:container port (web UI)

volumes:
  keycloak_data:
