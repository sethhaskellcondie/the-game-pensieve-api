# Production topology (Phase 6). Caddy is the ONLY service publishing ports (80/443) and terminates TLS;
# it reverse-proxies three hostnames — the web app, the MCP sidecar, and Keycloak. Everything else
# (backend, both databases, keycloak, mcp) is PRIVATE: reachable only on the compose network, no host ports.
#
# Images are the published artifacts — build + push them from their repos first (the frontend lives in
# the-game-pensieve-web-v2; backend, mcp, and the realm live here).
#
# Values in ${...} come from a .env file NEXT TO THIS ONE, in this directory (see .env.production.example
# here; on the Droplet that is /opt/pensieve/dockerCompose/.env). Compose auto-loads `.env` from the project
# directory — the directory holding this file — so no --env-file flag is needed:
#
#   docker compose -f /opt/pensieve/dockerCompose/compose.production.yaml up -d
#
# A MISSING .env is not fatal at parse time: compose prints one `variable is not set` WARNING per ${VAR} and
# interpolates a blank string, and the stack then dies on boot (postgres refuses a blank password, Caddy gets
# an empty hostname). Read the warnings — do not scroll past them. scripts/deploy-production.sh asserts the
# file exists in preflight and passes --env-file explicitly, which turns that into a hard error (exit 1).
#
# Bind mounts below are relative to THIS file (`..` = repo root), so they are correct regardless of the
# working directory compose is invoked from — verified with `docker compose config` from an unrelated cwd.
#
# Keycloak imports the PRODUCTION realm file (keycloak/import-prod/pensieve-realm.json) — NOT the dev one.
# The prod realm has no test users, no dev test client, no anonymous DCR, and sslRequired=external; its
# deployment-specific values (audience URL, web redirect URIs, web client secret) are ${...} placeholders
# that Keycloak resolves from this service's environment at import time.
#
# AFTER FIRST DEPLOY, VERIFY (the import runs once, on first boot with an empty keycloak-db):
#   • decode an access token and check aud == https://${MCP_DOMAIN}/mcp and iss == https://${AUTH_DOMAIN}/realms/pensieve
#     (a literal "${PENSIEVE_...}" anywhere means placeholder substitution failed — fix and re-import);
#   • anonymous client registration is rejected (POST /realms/pensieve/clients-registrations/openid-connect);
#   • remote MCP hosts (e.g. claude.ai connectors) are PRE-REGISTERED as clients via the admin console —
#     there is deliberately no anonymous DCR in production.
# The audience is validated by BOTH the sidecar and the backend; a mismatch rejects every token.

# Pinned, not derived from the directory name: `docker compose ... down -v` must mean the same stack no matter
# where the repo is checked out or which directory the operator is standing in. (This is the value the old
# /opt/pensieve layout produced by accident; naming it makes it a guarantee.)
name: pensieve

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Basic-auth gate in front of Keycloak's /admin and /realms/master (see Caddyfile). The hash is a
      # bcrypt string from `caddy hash-password`; single-quote it in .env so its $ signs survive.
      KC_ADMIN_UI_USER: ${KC_ADMIN_UI_USER}
      KC_ADMIN_UI_PASSWORD_HASH: ${KC_ADMIN_UI_PASSWORD_HASH}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro   # relative to this file's directory, not to your shell
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - mcp
      - keycloak

  frontend:
    image: sethcondie/the-game-pensieve-web:latest # built + pushed from the-game-pensieve-web-v2 (OIDC BFF)
    restart: unless-stopped
    # NO public ports: served behind Caddy at https://${APP_DOMAIN}.
    environment:
      # Server-side only; reaches the backend privately over the compose network.
      API_BASE_URL: http://backend:8080/v1
      # The PUBLIC origin, and it is required behind Caddy. Next's standalone server binds 0.0.0.0:3000,
      # and `request.url` in a Route Handler reports that bind address rather than the proxied Host — so
      # without this the app asks Keycloak for redirect_uri=https://0.0.0.0:3000/api/auth/callback, which
      # the realm does not register, and every login dies on "Invalid parameter: redirect_uri". Deliberately
      # configuration rather than trusting X-Forwarded-Host: the callback redirects the browser to this
      # origin, so a spoofable value would be an open redirect. (Unset elsewhere — the unproxied stacks
      # publish the frontend directly, where the request's own origin is already correct.)
      APP_ORIGIN: https://${APP_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      # OIDC_ISSUER is browser-facing (login redirect + id_token iss); OIDC_INTERNAL_ISSUER is the
      # server-to-server token/refresh path over the internal network.
      OIDC_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/pensieve
      OIDC_CLIENT_ID: pensieve-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    depends_on:
      - backend

  backend:
    image: sethcondie/the-game-pensieve-api:latest
    restart: unless-stopped
    # NO ports: private. The backend runs Flyway on startup, so no separate migration service is needed.
    environment:
      SPRING_PROFILES_ACTIVE: docker,secured
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pensieve-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # OAuth2 resource server. iss is the canonical public issuer; keys are fetched over the internal
      # network; aud is the public /mcp resource URL (must match the realm's Audience mapper).
      PENSIEVE_OAUTH2_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      PENSIEVE_OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/pensieve/protocol/openid-connect/certs
      PENSIEVE_OAUTH2_AUDIENCE: https://${MCP_DOMAIN}/mcp
    depends_on:
      - db
      - keycloak

  mcp:
    image: sethcondie/the-game-pensieve-mcp:latest
    restart: unless-stopped
    # NO public ports: served behind Caddy at https://${MCP_DOMAIN}/mcp.
    environment:
      API_BASE_URL: http://backend:8080/v1
      PORT: "3000"
      # required: the prod backend is always secured, so enforce unconditionally (no probe dependency).
      MCP_AUTH_MODE: required
      MCP_OAUTH_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      MCP_OAUTH_JWKS_URI: http://keycloak:8080/realms/pensieve/protocol/openid-connect/certs
      MCP_OAUTH_AUDIENCE: https://${MCP_DOMAIN}/mcp
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    # start (production mode) + import the realm on first boot. Behind Caddy: TLS is terminated at the edge,
    # so HTTP is enabled internally and Keycloak trusts the X-Forwarded-* headers. KC_HOSTNAME pins the
    # canonical public issuer; BACKCHANNEL_DYNAMIC lets in-network services fetch JWKS via keycloak:8080.
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Resolved into the ${...} placeholders in keycloak/import-prod/pensieve-realm.json at import time.
      PENSIEVE_APP_DOMAIN: ${APP_DOMAIN}
      PENSIEVE_MCP_DOMAIN: ${MCP_DOMAIN}
      PENSIEVE_WEB_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # SMTP relay for the realm's email verification and password-reset messages. STARTTLS/SSL are a pair:
      # port 587 -> STARTTLS=true, SSL=false; port 465 -> STARTTLS=false, SSL=true.
      PENSIEVE_SMTP_HOST: ${SMTP_HOST}
      PENSIEVE_SMTP_PORT: ${SMTP_PORT}
      PENSIEVE_SMTP_FROM: ${SMTP_FROM}
      PENSIEVE_SMTP_USER: ${SMTP_USER}
      PENSIEVE_SMTP_PASSWORD: ${SMTP_PASSWORD}
      PENSIEVE_SMTP_STARTTLS: ${SMTP_STARTTLS}
      PENSIEVE_SMTP_SSL: ${SMTP_SSL}
    volumes:
      - ../keycloak/import-prod:/opt/keycloak/data/import:ro   # relative to this file's directory
    depends_on:
      - keycloak-db

  db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    # NO ports: private.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pensieve-db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak-db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    # NO ports: private. Keycloak's own store, separate from the app database.
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  keycloak_db_data:
  caddy_data:
  caddy_config:
