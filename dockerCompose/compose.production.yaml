# Production topology (Phase 6). Caddy is the ONLY service publishing internet-facing ports (80/443) and
# terminates TLS; it reverse-proxies three hostnames — the web app, the MCP sidecar, and Keycloak.
# Everything else (backend, both databases, keycloak, mcp) is PRIVATE: reachable only on the compose
# network, with one deliberate exception — the app database publishes 5432 on the Droplet's LOOPBACK
# interface only, for IDE access over an SSH tunnel (see the db service).
#
# Images are the published artifacts — build + push them from their repos first (the frontend lives in
# the-game-pensieve-web-v2; backend, mcp, and the realm live here).
#
# Values in ${...} come from a .env file NEXT TO THIS ONE, in this directory (see .env.production.example
# here; on the Droplet that is /opt/pensieve/dockerCompose/.env). Compose auto-loads `.env` from the project
# directory — the directory holding this file — so no --env-file flag is needed:
#
#   docker compose -f /opt/pensieve/dockerCompose/compose.production.yaml up -d
#
# A MISSING .env is not fatal at parse time: compose prints one `variable is not set` WARNING per ${VAR} and
# interpolates a blank string, and the stack then dies on boot (postgres refuses a blank password, Caddy gets
# an empty hostname). Read the warnings — do not scroll past them. scripts/deploy-production.sh asserts the
# file exists in preflight and passes --env-file explicitly, which turns that into a hard error (exit 1).
#
# Bind mounts below are relative to THIS file (`..` = repo root), so they are correct regardless of the
# working directory compose is invoked from — verified with `docker compose config` from an unrelated cwd.
#
# Keycloak imports the PRODUCTION realm file (keycloak/import-prod/pensieve-realm.json) — NOT the dev one.
# The prod realm has no test users, no dev test client, no anonymous DCR, and sslRequired=external; its
# deployment-specific values (audience URL, web redirect URIs, web client secret) are ${...} placeholders
# that Keycloak resolves from this service's environment at import time.
#
# AFTER FIRST DEPLOY, VERIFY (the import runs once, on first boot with an empty keycloak-db):
#   • decode an access token and check aud == https://${MCP_DOMAIN}/mcp and iss == https://${AUTH_DOMAIN}/realms/pensieve
#     (a literal "${PENSIEVE_...}" anywhere means placeholder substitution failed — fix and re-import);
#   • anonymous client registration is rejected (POST /realms/pensieve/clients-registrations/openid-connect);
#   • remote MCP hosts (e.g. claude.ai connectors) are PRE-REGISTERED as clients via the admin console —
#     there is deliberately no anonymous DCR in production.
# The audience is validated by BOTH the sidecar and the backend; a mismatch rejects every token.

# HEALTHCHECKS AND STARTUP ORDER. Every service defines one, and `depends_on` uses `condition:
# service_healthy` rather than the bare list form — with ONE deliberate exception, caddy's dependency on
# keycloak, which is service_started so that an auth outage cannot black out the entire site (see there). `depends_on` on its own waits for a container to *start*,
# which is nearly worthless here: Postgres needs a moment before it accepts connections, Keycloak's first
# boot imports the realm for 30-60s, and the backend runs every Flyway migration before it opens a port.
# Without real readiness gates the dependents come up, fail their first call, and `restart: unless-stopped`
# turns that into a crash loop that eventually settles — a slow, noisy boot that looks like a bug.
#
# The other half of the value is honest status: `docker compose ps` reports "running" for a hung JVM that
# will never serve a request. With a healthcheck it reports "unhealthy", which is what an operator and a
# deploy script both need to see. (Note that compose does NOT restart an unhealthy container — `restart:
# unless-stopped` reacts only to a process exiting. The healthcheck reports; it does not remediate.)
#
# The chain is deliberately WIDE rather than deep, so first boot is not fully serial:
#   keycloak-db ─▶ keycloak ─┐
#   db ─▶ backend ─▶ frontend ├─▶ caddy
#              └──▶ mcp ──────┘
# The backend does NOT wait on Keycloak: it fetches JWKS lazily on the first token it sees, so gating its
# boot on the realm import would add a minute to every deploy for nothing.
#
# RESOURCE LIMITS. `mem_limit`/`cpus` on every service, sized for the 4 GB Droplet. Without them one runaway
# container takes the whole box down with it — and on a single-host stack that means the app, BOTH
# databases, and Caddy's certificate store at once. The limits below total ~2.9 GB, leaving the OS and the
# 2 GB swap file room to work. They are ceilings, not reservations. `mem_limit` is the v2 spelling and is
# what plain `docker compose` honors; `deploy.resources` is Swarm-only and is silently ignored here.

# Pinned, not derived from the directory name: `docker compose ... down -v` must mean the same stack no matter
# where the repo is checked out or which directory the operator is standing in. (This is the value the old
# /opt/pensieve layout produced by accident; naming it makes it a guarantee.)
name: pensieve

services:
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MCP_DOMAIN: ${MCP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Optional typo-catcher host that 301s to APP_DOMAIN (see the Caddyfile's alias site block).
      # The `:-alias.localhost` fallback is REQUIRED and must stay in sync with the Caddyfile's own
      # `{$APP_ALIAS_DOMAIN:alias.localhost}` default. Caddy's `{$VAR:default}` only applies when the
      # variable is UNSET: passing it through as an empty string instead makes the site address empty,
      # at which point Caddy reads the block as a global options block and the WHOLE config fails to
      # load with "unrecognized global option: import" — every host down, not just the alias. Compose's
      # `:-` covers unset and empty alike, so the container never sees a blank value. (Verified against
      # caddy:2 with `caddy adapt`, 2026-08-20.)
      APP_ALIAS_DOMAIN: ${APP_ALIAS_DOMAIN:-alias.localhost}
      # (The former KC_ADMIN_UI_* basic-auth gate variables were removed 2026-08-18 along with the
      # gate itself — see the Caddyfile's auth-host comment for the decision and its preconditions.)
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro   # relative to this file's directory, not to your shell
      - caddy_data:/data
      - caddy_config:/config
    # Caddy's own admin API on :2019 is loopback-only and never published; it answers as soon as the config
    # is loaded, which is exactly the liveness signal wanted here. Do NOT probe a site URL instead: on first
    # boot Caddy is still completing the ACME challenge, and a failing probe there would say "unhealthy"
    # about a certificate, not about Caddy.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      frontend:
        condition: service_healthy
      mcp:
        condition: service_healthy
      keycloak:
        # DELIBERATELY service_started, not service_healthy — the one exception to the rule above.
        # Caddy is the ONLY service that publishes a port, so gating it on Keycloak's health means an
        # auth-only failure takes down the app, the API, and mcp with it. That is exactly what happened
        # on 2026-08-28: Keycloak crash-looped, caddy never left `Created`, and every public endpoint
        # went dark even though frontend/backend/mcp were all healthy. Starting anyway degrades LOGIN
        # (auth routes 502 until Keycloak is ready) instead of blacking out the whole site. The deploy's
        # step-7 health checks still fail loudly on a sick Keycloak, so this hides nothing.
        condition: service_started

  frontend:
    image: sethcondie/the-game-pensieve-web:1.0.6 # built + pushed from the-game-pensieve-web-v2 (OIDC BFF)
    restart: unless-stopped
    # NO public ports: served behind Caddy at https://${APP_DOMAIN}.
    environment:
      # Server-side only; reaches the backend privately over the compose network.
      API_BASE_URL: http://backend:8080/v1
      # The PUBLIC origin, and it is required behind Caddy. Next's standalone server binds 0.0.0.0:3000,
      # and `request.url` in a Route Handler reports that bind address rather than the proxied Host — so
      # without this the app asks Keycloak for redirect_uri=https://0.0.0.0:3000/api/auth/callback, which
      # the realm does not register, and every login dies on "Invalid parameter: redirect_uri". Deliberately
      # configuration rather than trusting X-Forwarded-Host: the callback redirects the browser to this
      # origin, so a spoofable value would be an open redirect. (Unset elsewhere — the unproxied stacks
      # publish the frontend directly, where the request's own origin is already correct.)
      APP_ORIGIN: https://${APP_DOMAIN}
      # Seals gp_session, which holds live Keycloak access + refresh tokens. The `:?` guards on this and the
      # three secrets below abort `docker compose up` when the value is missing or blank, instead of starting a
      # stack that looks healthy but is not: an unset SESSION_SECRET used to fall back to a committed dev secret
      # (public in the repo), so anyone could forge a session cookie. The BFF now also refuses to boot without
      # it, but a compose-level guard fails in a second and names the variable, rather than in a container log.
      SESSION_SECRET: "${SESSION_SECRET:?required — at least 32 chars, generate with openssl rand -base64 48}"
      # OIDC_ISSUER is browser-facing (login redirect + id_token iss); OIDC_INTERNAL_ISSUER is the
      # server-to-server token/refresh path over the internal network.
      OIDC_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/pensieve
      OIDC_CLIENT_ID: pensieve-web
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?required — one-shot, baked into the realm at first import}"
    # The HEALTHCHECK is baked into the image (GET /api/auth/session — see the web repo's Dockerfile for why
    # that route and not /api/heartbeat). Next.js holds a modest heap; 512m is comfortable for the
    # standalone server, which serves RSC payloads and proxies JSON rather than doing real work.
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: sethcondie/the-game-pensieve-api:1.0.6
    restart: unless-stopped
    # NO ports: private. The backend runs Flyway on startup, so no separate migration service is needed.
    environment:
      SPRING_PROFILES_ACTIVE: docker,secured
      # Declares this a production deployment. ProductionSecurityGuard reads it and refuses to start if
      # `secured` is missing from the line above — without `secured` the app permits every request and disables
      # every role check, and it boots green while doing so. The marker is deliberately a separate variable from
      # the profile list, so the slip that drops `secured` cannot also disarm the guard that catches it.
      PENSIEVE_ENV: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pensieve-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?required — generate with openssl rand -base64 48}"
      # OAuth2 resource server. iss is the canonical public issuer; keys are fetched over the internal
      # network; aud is the public /mcp resource URL (must match the realm's Audience mapper).
      PENSIEVE_OAUTH2_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      PENSIEVE_OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/pensieve/protocol/openid-connect/certs
      PENSIEVE_OAUTH2_AUDIENCE: https://${MCP_DOMAIN}/mcp
      # Where logging.file.path points (application.properties defaults it to a relative path for local
      # runs). Backed by the backend_logs volume below — without a mount the log is written inside the
      # container's writable layer and is destroyed on every redeploy, which is precisely when you want it.
      PENSIEVE_LOG_PATH: /var/log/pensieve
    volumes:
      - backend_logs:/var/log/pensieve
    # The HEALTHCHECK is baked into the image (curl /v1/heartbeat, with a 180s start period for Flyway).
    # 1g is the JVM's ceiling, not its appetite: the heap is left to the JVM's own container-aware default
    # (¼ of the limit) and the rest covers metaspace, code cache, and thread stacks.
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      db:
        condition: service_healthy

  mcp:
    image: sethcondie/the-game-pensieve-mcp:1.0.6
    restart: unless-stopped
    # NO public ports: served behind Caddy at https://${MCP_DOMAIN}/mcp.
    environment:
      API_BASE_URL: http://backend:8080/v1
      PORT: "3000"
      # required: the prod backend is always secured, so enforce unconditionally (no probe dependency).
      MCP_AUTH_MODE: required
      MCP_OAUTH_ISSUER: https://${AUTH_DOMAIN}/realms/pensieve
      MCP_OAUTH_JWKS_URI: http://keycloak:8080/realms/pensieve/protocol/openid-connect/certs
      MCP_OAUTH_AUDIENCE: https://${MCP_DOMAIN}/mcp
      # Verified tokens must also CARRY this scope, not merely be advertised it. Left at the default
      # (= MCP_OAUTH_SCOPES = pensieve:read) and stated here because it is the second half of taking
      # pensieve:read off the realm's default client scopes — see keycloak/README.md § Audience
      # segmentation. Set it to "" only if a connector cannot be granted the scope in Keycloak.
      MCP_OAUTH_SCOPES: pensieve:read
    # The HEALTHCHECK is baked into the image (GET /healthz).
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    restart: unless-stopped
    # start (production mode) + import the realm on first boot. Behind Caddy: TLS is terminated at the edge,
    # so HTTP is enabled internally and Keycloak trusts the X-Forwarded-* headers. KC_HOSTNAME pins the
    # canonical public issuer; BACKCHANNEL_DYNAMIC lets in-network services fetch JWKS via keycloak:8080.
    command: start --import-realm
    environment:
      # Exposes /health/* on the MANAGEMENT interface (port 9000 since KC 25, never published) for the
      # healthcheck below. Off by default.
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?required — generate with openssl rand -base64 48}"
      # Resolved into the ${...} placeholders in keycloak/import-prod/pensieve-realm.json at import time.
      PENSIEVE_APP_DOMAIN: ${APP_DOMAIN}
      PENSIEVE_MCP_DOMAIN: ${MCP_DOMAIN}
      PENSIEVE_WEB_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?required — must match the frontend OIDC_CLIENT_SECRET}"
      # SMTP relay for the realm's email verification and password-reset messages. STARTTLS/SSL are a pair:
      # port 587/2587 -> STARTTLS=true, SSL=false; port 465/2465 -> STARTTLS=false, SSL=true.
      PENSIEVE_SMTP_HOST: ${SMTP_HOST}
      PENSIEVE_SMTP_PORT: ${SMTP_PORT}
      PENSIEVE_SMTP_FROM: ${SMTP_FROM}
      PENSIEVE_SMTP_USER: ${SMTP_USER}
      PENSIEVE_SMTP_PASSWORD: ${SMTP_PASSWORD}
      PENSIEVE_SMTP_STARTTLS: ${SMTP_STARTTLS}
      PENSIEVE_SMTP_SSL: ${SMTP_SSL}
    volumes:
      - ../keycloak/import-prod:/opt/keycloak/data/import:ro   # relative to this file's directory
    # The Keycloak image is UBI-micro based and ships NO curl and NO wget — only bash. Hence the /dev/tcp
    # trick, which is a bash builtin: open a socket on fd 3, write a raw HTTP/1.1 request, and match the
    # status line. Matching "200 OK" rather than grepping the JSON for "UP" is deliberate: /health/ready
    # answers 503 while a sub-check is down, but its body still contains "status": "UP" for every sub-check
    # that IS up, so a naive grep would call a degraded Keycloak healthy. Before the management port is
    # listening at all the connect fails outright, which is also correctly unhealthy.
    # start_period is generous because the FIRST boot imports the realm (30-60s locally, longer on the
    # Droplet with a cold pull); subsequent boots are much faster.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        # The backslashes are DOUBLED so printf receives the two-character escapes \r \n and emits the CRLFs
        # itself. Writing them singly makes YAML expand them into literal control characters inside this
        # file — which happens to work, but leaves invisible CRs in a config file that people diff and edit.
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      keycloak-db:
        condition: service_healthy

  # Both databases stay on the 16.x line. A MINOR bump (16.x -> 17.x) is not a restart — Postgres refuses
  # to start against a data directory written by a different major version, and migrating means a dump and
  # restore with the stack down. Patch releases inside 16.x are drop-in.
  #
  # EVERY third-party image is pinned BY DIGEST (@sha256:...), not by tag. The tag is kept alongside it for
  # human readability only; the digest is what actually resolves. This is not belt-and-braces — it is the
  # fix for a real outage (2026-08-28, deploying 1.0.5): `keycloak:26.7` was a MOVING tag, upstream
  # published a new 26.7 build, and the deploy's `docker compose pull` silently swapped a core service
  # nobody had asked to upgrade. The new build rejected the blank KC_ADMIN_* steady state, Keycloak
  # crash-looped, and because caddy gated on its health the whole site went dark. Rollback could not fix it
  # either: `deploy VERSION=<previous>` rolls back OUR images, but the moving tag had already re-resolved,
  # so the previous version recreated the same broken container. Digests make a deploy reproducible and
  # make rollback actually roll back.
  #
  # To upgrade one of these, do it DELIBERATELY, in its own reviewed commit:
  #   docker buildx imagetools inspect <image>:<tag> --format '{{.Manifest.Digest}}'
  # then update BOTH the tag and the digest here, and rehearse (`make rehearse`) before releasing.
  db:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # Loopback-only publish: 127.0.0.1 binding means this is unreachable from the internet regardless of
    # firewall rules — only a shell already on the Droplet (i.e. an SSH tunnel) can connect. Exists so an
    # IDE database client can tunnel in; see "Connecting an IDE to the production database" in
    # documentation/buildFromScratch.md.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pensieve-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # -U/-d are not optional: bare `pg_isready` probes user "root" against database "root" (it defaults to
    # the OS user), which answers "accepting connections" only by accident of Postgres replying at all.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pensieve-db"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 512m
    cpus: 1.0

  keycloak-db:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    # NO ports: private. Keycloak's own store, separate from the app database.
    # ⚠️ keycloak_db_data is the irreplaceable volume: users.keycloak_sub in the APP database is a unique
    # reference into it. Lose it and every existing user is orphaned from their collection. Never `down -v`.
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: 384m
    cpus: 1.0

volumes:
  postgres_data:
  keycloak_db_data:
  caddy_data:
  caddy_config:
  # The backend's rolling log file. Named rather than a host bind mount so it survives a redeploy without
  # depending on a path existing on the Droplet; read it with
  # `docker compose -f dockerCompose/compose.production.yaml exec backend cat /var/log/pensieve/spring.log`.
  backend_logs:
